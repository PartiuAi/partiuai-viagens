<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#060819" />
    <meta
      name="description"
      content="PartiuAí — monte sua rota, descubra paradas pelo caminho e escolha entre carro, ônibus, táxi ou moto para viajar do seu jeito."
    />
    <meta name="author" content="PartiuAí" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://partiuai.com.br/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PartiuAí" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://partiuai.com.br/" />
    <meta property="og:title" content="PartiuAí — Vá para qualquer destino na nossa região" />
    <meta
      property="og:description"
      content="Planeje rotas, compare opções de viagem e parta do seu jeito. Carro, ônibus, táxi e moto em um só lugar."
    />
    <meta property="og:image" content="https://partiuai.com.br/brand/logo-wordmark-color.png" />
    <meta property="og:image:width" content="1255" />
    <meta property="og:image:height" content="249" />
    <meta property="og:image:alt" content="PartiuAí" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PartiuAí — Vá para qualquer destino" />
    <meta
      name="twitter:description"
      content="Monte sua rota, descubra paradas pelo caminho e escolha como partir."
    />
    <meta name="twitter:image" content="https://partiuai.com.br/brand/logo-wordmark-color.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Paints the app background before React mounts, avoiding a white flash. -->
    <style>
      html {
        background: #060819;
      }
      html[data-theme='light'] {
        background: #f4f5ff;
      }
      .no-js {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 32px;
        background: #060819;
        color: #f2f3ff;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        line-height: 1.6;
      }
      .no-js h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      .no-js p {
        margin: 0;
        color: #c3c7e6;
      }
    </style>

    <!-- Applies the saved theme before the first paint to avoid a flash. -->
    <script>
      try {
        var saved = localStorage.getItem('partiuai-theme')
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.dataset.theme = saved
          document.documentElement.style.colorScheme = saved
        }
      } catch (error) {
        /* localStorage can be unavailable in private contexts */
      }
    </script>

    <title>PartiuAí — Vá para qualquer destino</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="no-js">
        <h1>PartiuAí</h1>
        <p>
          Este sistema precisa de JavaScript para funcionar.<br />
          Ative o JavaScript no seu navegador para planejar a sua rota.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
